# 🇺🇸 Bare on purpose: no cloud-identity annotation lives here so this base
# stays provider-agnostic. Each `../autounseal/<provider>` overlay patches
# in exactly the annotation its KMS needs (IRSA for AWS, Workload Identity
# for GCP, workload identity federation for Azure) — `shamir`/`transit`/
# `static` need none, so they leave this file untouched.
# 🇧🇷 De propósito vazio: nenhuma anotação de identidade de nuvem mora aqui
# para esta base ficar agnóstica de provedor. Cada overlay
# `../autounseal/<provedor>` aplica um patch com exatamente a anotação que
# seu KMS precisa (IRSA para AWS, Workload Identity para GCP, federação de
# identidade de carga de trabalho para Azure) — `shamir`/`transit`/`static`
# não precisam de nenhuma, então deixam este arquivo intocado.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: openbao
automountServiceAccountToken: true
