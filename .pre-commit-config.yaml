# Fast checks before every commit (`make hooks` installs them). Every hook is a local command through `uv run`, so it
# uses the exact tool versions pinned in `uv.lock`, the same ones `make lint` and CI use. Slow checks (mypy, tests,
# clippy) stay in `make check`.
repos:
  - repo: local
    hooks:
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]
      - id: ruff-check
        name: ruff check --fix
        entry: uv run ruff check --fix --exit-non-zero-on-fix
        language: system
        types: [python]
      - id: docs
        name: docs in pairs, no dead links
        entry: uv run python scripts/check_docs.py
        language: system
        pass_filenames: false
        types: [markdown]
      - id: cargo-fmt
        name: cargo fmt
        entry: cargo fmt --manifest-path apps/sdk/native/Cargo.toml --
        language: system
        types: [rust]
