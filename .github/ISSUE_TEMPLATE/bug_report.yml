name: "Bug report"
description: "Something isn't working as documented."
title: "[bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this. The more precise the repro, the faster it gets fixed.

  - type: dropdown
    id: package
    attributes:
      label: "Layer"
      description: "Which layer is affected?"
      options:
        - "diagnos — base (docs, version, setup, help)"
        - "diagnos[sdk] — SDK"
        - "diagnos[cli] — CLI"
        - "diagnos[api] — REST API"
        - "images (ghcr.io/diagnos-tech)"
        - docs
        - other
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: "Package version(s)"
      description: "From `diagnos version` (paste `--json` if you can)."
      placeholder: "e.g. diagnos 0.1.0"
    validations:
      required: true

  - type: input
    id: python-version
    attributes:
      label: "Python version"
      description: "Output of `python --version`."
      placeholder: "e.g. 3.12.4"
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: "Operating system"
      description: "Distro and version, or container base image."
      placeholder: "e.g. Ubuntu 22.04, python:3.12-slim"
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: "Steps to reproduce"
      description: "Minimal code or commands that trigger the bug. Redact tokens and any patient data."
      placeholder: |
        1. …
        2. …
        3. …
      render: shell
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: "Expected behavior"
      description: "What you expected to happen."
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: "Actual behavior"
      description: "What actually happened. Include the full traceback or error output, if there is one."
      render: shell
    validations:
      required: true

  - type: textarea
    id: extra
    attributes:
      label: "Anything else"
      description: "Logs, screenshots, links (optional)."
    validations:
      required: false

  - type: checkboxes
    id: security
    attributes:
      label: "Before you submit"
      options:
        - label: "This is not a security vulnerability (those go to [GitHub Security Advisories](https://github.com/diagnos-tech/integration/security/advisories/new), not a public issue; see SECURITY.md)."
          required: true
