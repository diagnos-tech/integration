name: "Bug report · Relato de bug"
description: "🇺🇸 Something isn't working as documented. · 🇧🇷 Algo não está funcionando como documentado."
title: "[bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        🇺🇸 Thanks for taking the time to report this. The more precise the repro, the faster it gets fixed.
        🇧🇷 Obrigado por tirar um tempo para reportar isto. Quanto mais precisa a reprodução, mais rápido é corrigido.

  - type: dropdown
    id: package
    attributes:
      label: "Package · Pacote"
      description: "🇺🇸 Which package is affected? · 🇧🇷 Qual pacote é afetado?"
      options:
        - diagnos
        - diagnos-cli
        - diagnos-api
        - docs
        - other · outro
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: "Package version(s) · Versão(ões) do pacote"
      description: "🇺🇸 From `pip show <package>` or your lockfile. · 🇧🇷 De `pip show <pacote>` ou do seu lockfile."
      placeholder: "e.g. diagnos 0.1.0 · ex.: diagnos 0.1.0"
    validations:
      required: true

  - type: input
    id: python-version
    attributes:
      label: "Python version · Versão do Python"
      description: "🇺🇸 Output of `python --version`. · 🇧🇷 Saída de `python --version`."
      placeholder: "e.g. 3.12.4"
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: "Operating system · Sistema operacional"
      description: "🇺🇸 Distro/version, or container base image. · 🇧🇷 Distro/versão, ou imagem base do container."
      placeholder: "e.g. Ubuntu 22.04, python:3.12-slim"
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: "Steps to reproduce · Passos para reproduzir"
      description: "🇺🇸 Minimal code or commands that trigger the bug. Redact tokens and any patient data. · 🇧🇷 Código ou comandos mínimos que disparam o bug. Redija tokens e qualquer dado de paciente."
      placeholder: |
        1. …
        2. …
        3. …
      render: shell
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: "Expected behavior · Comportamento esperado"
      description: "🇺🇸 What you expected to happen. · 🇧🇷 O que você esperava que acontecesse."
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: "Actual behavior · Comportamento observado"
      description: "🇺🇸 What actually happened — include the full traceback/error output if there is one. · 🇧🇷 O que de fato aconteceu — inclua o traceback/saída de erro completo, se houver."
      render: shell
    validations:
      required: true

  - type: textarea
    id: extra
    attributes:
      label: "Anything else · Mais alguma coisa"
      description: "🇺🇸 Logs, screenshots, links — optional. · 🇧🇷 Logs, screenshots, links — opcional."
    validations:
      required: false

  - type: checkboxes
    id: security
    attributes:
      label: "Before you submit · Antes de enviar"
      options:
        - label: "🇺🇸 This is not a security vulnerability (those go to [GitHub Security Advisories](https://github.com/diagnos-tech/integration/security/advisories/new), not a public issue — see SECURITY.md). · 🇧🇷 Isto não é uma vulnerabilidade de segurança (essas vão para o [GitHub Security Advisories](https://github.com/diagnos-tech/integration/security/advisories/new), não uma issue pública — veja SECURITY.pt-BR.md)."
          required: true
