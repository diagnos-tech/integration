name: "Feature request"
description: "Suggest an addition or a change."
title: "[feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion. Note that the CLI and the API only ever wrap what the SDK exposes, so a
        feature that needs a new capability usually belongs in the SDK first.

  - type: dropdown
    id: package
    attributes:
      label: "Layer"
      description: "Which layer would this affect?"
      options:
        - "diagnos — base (docs, version, setup, help)"
        - "diagnos[sdk] — SDK"
        - "diagnos[cli] — CLI"
        - "diagnos[api] — REST API"
        - "images (ghcr.io/diagnos-tech)"
        - docs
        - other
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: "Package version(s)"
      description: "The version you're using today, if relevant."
      placeholder: "e.g. diagnos 0.1.0"
    validations:
      required: false

  - type: input
    id: python-version
    attributes:
      label: "Python version"
      description: "If the request is specific to a Python version."
      placeholder: "e.g. 3.12.4"
    validations:
      required: false

  - type: input
    id: os
    attributes:
      label: "Operating system"
      description: "If the request is specific to a platform."
      placeholder: "e.g. Ubuntu 22.04, Kubernetes"
    validations:
      required: false

  - type: textarea
    id: problem
    attributes:
      label: "What problem does this solve"
      description: "What are you trying to do today that this would make possible or easier?"
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: "Proposed solution"
      description: "What you'd like to see: an API sketch, a CLI flag, a route."
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: "Alternatives considered"
      description: "Other approaches you thought about, and why you prefer this one (optional)."
    validations:
      required: false

  - type: textarea
    id: extra
    attributes:
      label: "Anything else"
      description: "Links, references, related issues (optional)."
    validations:
      required: false
