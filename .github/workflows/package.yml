# Package: do the distributions build, and do they work, on every platform we ship?
#
# Seven abi3 wheels (manylinux and musllinux on x86_64 and aarch64, macOS on arm64 and x86_64, Windows x64) and the
# sdist, each built on a runner of its own platform. `checksums` hashes all eight before any job that runs
# third-party code starts, and publishes the hashes as a job output, which no later job can rewrite; every consumer
# of the files, here and in release.yml, verifies against it. Each wheel is then installed alone on its platform,
# bare and with every extra (scripts/release_smoke.py); the sdist must rebuild into a working wheel; and both images
# must build from this run's wheels. `package` turns all of it into the one required check.
#
# It runs on pull requests into `main`, which is what makes `main` releasable; on demand; and from release.yml,
# which signs and publishes exactly what it produced. Nothing is cached, because a cache is shared state a release
# build must not inherit, and every tool is pinned: maturin, Rust (rust-toolchain.toml) and uv.
name: Package

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    outputs:
      version:
        description: "The version every manifest agrees on."
        value: ${{ jobs.version.outputs.version }}
      sha256sums:
        description: "`sha256sum` lines of the eight distributions, computed before any third-party code ran."
        value: ${{ jobs.checksums.outputs.sha256sums }}

# No permission by default: every job asks for exactly what it uses.
permissions: {}

concurrency:
  # Under release.yml, `github.workflow` is the caller's name, so a manual run never queues behind a release.
  group: package-${{ github.workflow }}-${{ github.ref }}
  # A pull request run is disposable; a release run never is.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  MATURIN_VERSION: v1.15.0
  # Keep in sync with .github/actions/setup and the Dockerfile's `uv` stage.
  UV_VERSION: "0.13.0"

jobs:
  version:
    name: Version · tag
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      version: ${{ steps.guard.outputs.version }}
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # One version in pyproject.toml and the crate; on a tag, also `v<version>`, on `main`, dated in the changelog.
      - name: One version everywhere, and the tag says it
        id: guard
        run: python3 scripts/release_version.py

  wheels:
    name: Wheel · ${{ matrix.platform }}
    needs: version
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: linux-x86_64, runner: ubuntu-24.04, target: x86_64, manylinux: auto }
          - { platform: linux-aarch64, runner: ubuntu-24.04-arm, target: aarch64, manylinux: auto }
          - { platform: musllinux-x86_64, runner: ubuntu-24.04, target: x86_64, manylinux: musllinux_1_2 }
          - { platform: musllinux-aarch64, runner: ubuntu-24.04-arm, target: aarch64, manylinux: musllinux_1_2 }
          - { platform: macos-arm64, runner: macos-15, target: aarch64 }
          - { platform: macos-x86_64, runner: macos-15-intel, target: x86_64 }
          - { platform: windows-x86_64, runner: windows-2025, target: x64 }
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # One abi3 wheel per platform serves every CPython >= 3.11; Rust comes from rust-toolchain.toml.
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          maturin-version: ${{ env.MATURIN_VERSION }}
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux || 'auto' }}
          args: --release --locked --out dist
          sccache: false
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-${{ matrix.platform }}
          path: dist/*.whl
          if-no-files-found: error

  sdist:
    name: Source distribution
    needs: version
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          maturin-version: ${{ env.MATURIN_VERSION }}
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  checksums:
    name: Checksums
    needs: [wheels, sdist]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    outputs:
      sha256sums: ${{ steps.sum.outputs.sha256sums }}
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      # Exactly seven wheels and one sdist, hashed before anything else touches them.
      - name: Hash the eight distributions
        id: sum
        working-directory: dist
        run: |
          shopt -s nullglob
          files=(*) wheels=(*.whl) sdists=(*.tar.gz)
          if (( ${#wheels[@]} != 7 || ${#sdists[@]} != 1 || ${#files[@]} != 8 )); then
            printf 'unexpected file: %s\n' "${files[@]}"
            exit 1
          fi
          sha256sum -- "${files[@]}" | tee -a "$GITHUB_STEP_SUMMARY"
          { echo 'sha256sums<<SUMS_EOF'; sha256sum -- "${files[@]}"; echo 'SUMS_EOF'; } >> "$GITHUB_OUTPUT"

  smoke:
    name: Smoke · ${{ matrix.platform }}
    needs: checksums
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: linux-x86_64, runner: ubuntu-24.04 }
          - { platform: linux-aarch64, runner: ubuntu-24.04-arm }
          - { platform: musllinux-x86_64, runner: ubuntu-24.04, musl: true }
          - { platform: musllinux-aarch64, runner: ubuntu-24.04-arm, musl: true }
          - { platform: macos-arm64, runner: macos-15 }
          - { platform: macos-x86_64, runner: macos-15-intel }
          - { platform: windows-x86_64, runner: windows-2025 }
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist-${{ matrix.platform }}
          path: dist
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        if: ${{ !matrix.musl }}
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false
      # The oldest and the newest supported CPython, each in a throwaway environment: the base alone, then every
      # layer.
      - name: Base, then every layer (glibc, macOS, Windows)
        if: ${{ !matrix.musl }}
        shell: bash
        run: |
          wheels=(dist/*.whl)
          wheel="./${wheels[0]}"
          for python in 3.11 3.13; do
            uv run --no-project --isolated --python "$python" --with "$wheel" python scripts/release_smoke.py base
            uv run --no-project --isolated --python "$python" --with "diagnos[sdk,cli,api] @ $wheel" \
              python scripts/release_smoke.py full
          done
      # musl has no runner of its own: the official Alpine images, pinned by digest, are the platform.
      - name: Base, then every layer (musl)
        if: ${{ matrix.musl }}
        run: |
          for image in \
            python:3.11-alpine@sha256:d9368b3a5ac59afea7b5d4f2e2aea0941dbf9fdee9c369c5bec00b98244bc929 \
            python:3.13-alpine@sha256:2d9aefe2fef018a7eb2c13064c89c71929800fd2e5dccdbf52ea5da5bb8d929a; do
            docker run --rm -v "$PWD:/repo:ro" -e PIP_ROOT_USER_ACTION=ignore "$image" sh -euc '
              wheel=$(ls /repo/dist/*.whl)
              pip install --quiet --no-cache-dir "$wheel" && python /repo/scripts/release_smoke.py base
              pip install --quiet --no-cache-dir "$wheel[sdk,cli,api]" && python /repo/scripts/release_smoke.py full'
          done

  sdist-rebuild:
    name: Sdist rebuilds · metadata
    needs: checksums
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false
      # What PyPI checks on upload, checked first: the metadata and the README it renders.
      - name: PyPI will accept the metadata and render the README
        run: uvx --from twine==7.0.0 twine check --strict dist/*
      # A file missing from the sdist only shows when someone builds from it, so build from it and run the result.
      - name: The sdist alone builds a working wheel
        run: |
          echo "maturin==${MATURIN_VERSION#v}" > "$RUNNER_TEMP/build-constraints.txt"
          uv build --wheel --build-constraint "$RUNNER_TEMP/build-constraints.txt" --out-dir rebuilt dist/*.tar.gz
          wheels=(rebuilt/*.whl)
          wheel="./${wheels[0]}"
          uv run --no-project --isolated --python 3.13 --with "diagnos[sdk,cli,api] @ $wheel" \
            python scripts/release_smoke.py full

  images:
    name: Images build · ${{ matrix.target }}
    # Skipped under release.yml (a tag push), which builds and pushes the images itself; here they only have to
    # build, for both architectures.
    if: github.event_name != 'push'
    needs: checksums
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        target: [api, cli]
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-linux-*
          path: wheelhouse
          merge-multiple: true
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          image: tonistiigi/binfmt:qemu-v10.2.3-68@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0
          platforms: arm64
          cache-image: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: image=moby/buildkit:v0.33.1@sha256:cec9f139f45e93c5c69c60f8b07cfad9f43f4ef6b6a6cd917527fea5ff2e3dea
          cache-binary: false
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          build-contexts: wheels=wheelhouse
          pull: true
          no-cache: true
          push: false

  package:
    name: Package
    if: always()
    needs: [version, wheels, sdist, checksums, smoke, sdist-rebuild, images]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Every job passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        # Every job is listed, so a failure upstream is caught where it happened; `skipped` is only ever `images`
        # under release.yml.
        run: |
          for result in $RESULTS; do
            if [[ "$result" != success && "$result" != skipped ]]; then
              echo "::error::A required job ended as '$result'."
              exit 1
            fi
          done
