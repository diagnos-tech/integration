# 🇺🇸 Package: do the distributions build, and do they work, on every platform we ship?
#
#    Seven abi3 wheels (Linux glibc and musl on x86_64 and aarch64, macOS on arm64 and x86_64, Windows x64) and
#    the sdist, each built on a runner of its own platform. `checksums` hashes all eight before any job that runs
#    third-party code starts, and publishes the hashes as a job output, which no later job can rewrite. Every
#    consumer of the files — here and in `release.yml` — checks them against it. Then each wheel is installed
#    alone on its platform, twice: the bare base with no dependency at all, then with every layer
#    (`scripts/release_smoke.py`). The sdist must rebuild into a working wheel, and the two images must build
#    from the run's wheels.
#
#    It runs on pull requests that touch packaging, on demand (*Run workflow*: the rehearsal before a tag), and
#    from `release.yml`, which signs and publishes exactly what this produced. Nothing here is cached: a cache is
#    shared state a tag build must not inherit. Tools are pinned — maturin, Rust (`rust-toolchain.toml`), uv —
#    so every release is built by the same ones.
# 🇧🇷 Pacote: as distribuições constroem, e funcionam, em toda plataforma que publicamos?
#
#    Sete wheels abi3 (Linux glibc e musl em x86_64 e aarch64, macOS em arm64 e x86_64, Windows x64) e o sdist,
#    cada um construído num runner da própria plataforma. O `checksums` calcula o hash dos oito antes de qualquer
#    job que roda código de terceiros começar, e o publica como output de job, que nenhum job posterior consegue
#    reescrever. Todo consumidor dos arquivos — aqui e no `release.yml` — os confere contra ele. Depois cada
#    wheel é instalado sozinho na própria plataforma, duas vezes: a base pura sem dependência nenhuma, e então
#    com toda camada (`scripts/release_smoke.py`). O sdist precisa reconstruir um wheel que funciona, e as duas
#    imagens precisam construir a partir dos wheels da execução.
#
#    Roda em pull requests que mexem no empacotamento, sob demanda (*Run workflow*: o ensaio antes de uma tag), e
#    a partir do `release.yml`, que assina e publica exatamente o que isto produziu. Nada aqui usa cache: um
#    cache é estado compartilhado que um build de tag não pode herdar. As ferramentas são fixadas — maturin, Rust
#    (`rust-toolchain.toml`), uv — para todo release ser construído pelas mesmas.
name: Package

on:
  pull_request:
    paths:
      - pyproject.toml
      - uv.lock
      - rust-toolchain.toml
      - Dockerfile
      - .dockerignore
      - "src/**"
      - "apps/sdk/native/**"
      - "wrappers/py/README.md"
      - "scripts/release_*.py"
      - ".github/workflows/package.yml"
      - ".github/workflows/release.yml"
  workflow_dispatch:
  workflow_call:
    outputs:
      version:
        description: "The version every manifest agrees on."
        value: ${{ jobs.version.outputs.version }}
      sha256sums:
        description: "`sha256sum` lines of the eight distributions, computed before any third-party code ran."
        value: ${{ jobs.checksums.outputs.sha256sums }}

# 🇺🇸 No permission by default: every job asks for exactly what it uses.
# 🇧🇷 Nenhuma permissão por padrão: cada job pede exatamente o que usa.
permissions: {}

concurrency:
  group: package-${{ github.ref }}
  # 🇺🇸 A pull request run is disposable; a run under a tag never is. 🇧🇷 Uma execução de PR é descartável; a de uma tag nunca.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  MATURIN_VERSION: v1.15.0
  UV_VERSION: "0.13.0"

jobs:
  version:
    name: Version · tag
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      version: ${{ steps.guard.outputs.version }}
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # 🇺🇸 One version in `pyproject.toml` and the crate; on a tag, `v<version>`, on `develop`, dated in the changelog.
      # 🇧🇷 Uma versão no `pyproject.toml` e no crate; numa tag, `v<versão>`, na `develop`, datada no changelog.
      - name: One version everywhere, and the tag says it
        id: guard
        run: python3 scripts/release_version.py

  wheels:
    name: Wheel · ${{ matrix.platform }}
    needs: version
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: linux-x86_64, runner: ubuntu-24.04, target: x86_64, manylinux: auto }
          - { platform: linux-aarch64, runner: ubuntu-24.04-arm, target: aarch64, manylinux: auto }
          - { platform: musllinux-x86_64, runner: ubuntu-24.04, target: x86_64, manylinux: musllinux_1_2 }
          - { platform: musllinux-aarch64, runner: ubuntu-24.04-arm, target: aarch64, manylinux: musllinux_1_2 }
          - { platform: macos-arm64, runner: macos-15, target: aarch64 }
          - { platform: macos-x86_64, runner: macos-15-intel, target: x86_64 }
          - { platform: windows-x86_64, runner: windows-2025, target: x64 }
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # 🇺🇸 One abi3 wheel per platform serves every CPython ≥ 3.11; Rust comes from `rust-toolchain.toml`.
      # 🇧🇷 Um wheel abi3 por plataforma serve todo CPython ≥ 3.11; o Rust vem do `rust-toolchain.toml`.
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          maturin-version: ${{ env.MATURIN_VERSION }}
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux || 'auto' }}
          args: --release --locked --out dist
          sccache: false
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-${{ matrix.platform }}
          path: dist/*.whl
          if-no-files-found: error

  sdist:
    name: Source distribution
    needs: version
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          maturin-version: ${{ env.MATURIN_VERSION }}
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  checksums:
    name: Checksums
    needs: [wheels, sdist]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    outputs:
      sha256sums: ${{ steps.sum.outputs.sha256sums }}
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      # 🇺🇸 Exactly seven wheels and one sdist, hashed before anything else touches them.
      # 🇧🇷 Exatamente sete wheels e um sdist, com hash calculado antes de qualquer outra coisa tocá-los.
      - name: Hash the eight distributions
        id: sum
        working-directory: dist
        run: |
          shopt -s nullglob
          files=(*) wheels=(*.whl) sdists=(*.tar.gz)
          if (( ${#wheels[@]} != 7 || ${#sdists[@]} != 1 || ${#files[@]} != 8 )); then
            printf 'unexpected · inesperado: %s\n' "${files[@]}"
            exit 1
          fi
          sha256sum -- "${files[@]}" | tee -a "$GITHUB_STEP_SUMMARY"
          { echo 'sha256sums<<SUMS_EOF'; sha256sum -- "${files[@]}"; echo 'SUMS_EOF'; } >> "$GITHUB_OUTPUT"

  smoke:
    name: Smoke · ${{ matrix.platform }}
    needs: checksums
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: linux-x86_64, runner: ubuntu-24.04 }
          - { platform: linux-aarch64, runner: ubuntu-24.04-arm }
          - { platform: musllinux-x86_64, runner: ubuntu-24.04, musl: true }
          - { platform: musllinux-aarch64, runner: ubuntu-24.04-arm, musl: true }
          - { platform: macos-arm64, runner: macos-15 }
          - { platform: macos-x86_64, runner: macos-15-intel }
          - { platform: windows-x86_64, runner: windows-2025 }
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist-${{ matrix.platform }}
          path: dist
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        if: ${{ !matrix.musl }}
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false
      # 🇺🇸 The oldest and the newest supported CPython, each in a throwaway environment: base alone, then every layer.
      # 🇧🇷 O CPython mais antigo e o mais novo suportados, cada um num ambiente descartável: a base sozinha, depois toda camada.
      - name: Base, then every layer (glibc, macOS, Windows)
        if: ${{ !matrix.musl }}
        shell: bash
        run: |
          wheels=(dist/*.whl)
          wheel="./${wheels[0]}"
          for python in 3.11 3.13; do
            uv run --no-project --isolated --python "$python" --with "$wheel" python scripts/release_smoke.py base
            uv run --no-project --isolated --python "$python" --with "diagnos[sdk,cli,api] @ $wheel" \
              python scripts/release_smoke.py full
          done
      # 🇺🇸 musl has no runner of its own: the official Alpine images, pinned by digest, are the platform.
      # 🇧🇷 O musl não tem runner próprio: as imagens Alpine oficiais, fixadas por digest, são a plataforma.
      - name: Base, then every layer (musl)
        if: ${{ matrix.musl }}
        run: |
          for image in \
            python:3.11-alpine@sha256:d9368b3a5ac59afea7b5d4f2e2aea0941dbf9fdee9c369c5bec00b98244bc929 \
            python:3.13-alpine@sha256:2d9aefe2fef018a7eb2c13064c89c71929800fd2e5dccdbf52ea5da5bb8d929a; do
            docker run --rm -v "$PWD:/repo:ro" -e PIP_ROOT_USER_ACTION=ignore "$image" sh -euc '
              wheel=$(ls /repo/dist/*.whl)
              pip install --quiet --no-cache-dir "$wheel" && python /repo/scripts/release_smoke.py base
              pip install --quiet --no-cache-dir "$wheel[sdk,cli,api]" && python /repo/scripts/release_smoke.py full'
          done

  sdist-rebuild:
    name: Sdist rebuilds · metadata
    needs: checksums
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false
      # 🇺🇸 What PyPI will check on upload, checked first: metadata and the README it renders.
      # 🇧🇷 O que o PyPI vai conferir no envio, conferido antes: metadados e o README que ele renderiza.
      - name: PyPI will accept the metadata and render the README
        run: uvx --from twine==7.0.0 twine check --strict dist/*
      # 🇺🇸 A file missing from the sdist only shows when someone builds from it — so build from it, and run the result.
      # 🇧🇷 Um arquivo faltando no sdist só aparece quando alguém constrói a partir dele — então construa, e rode o resultado.
      - name: The sdist alone builds a working wheel
        run: |
          echo "maturin==${MATURIN_VERSION#v}" > "$RUNNER_TEMP/build-constraints.txt"
          uv build --wheel --build-constraint "$RUNNER_TEMP/build-constraints.txt" --out-dir rebuilt dist/*.tar.gz
          wheels=(rebuilt/*.whl)
          wheel="./${wheels[0]}"
          uv run --no-project --isolated --python 3.13 --with "diagnos[sdk,cli,api] @ $wheel" \
            python scripts/release_smoke.py full

  images:
    name: Images build · ${{ matrix.target }}
    # 🇺🇸 Release builds and pushes them itself; here they only have to build, for both architectures.
    # 🇧🇷 O release as constrói e envia sozinho; aqui elas só precisam construir, para as duas arquiteturas.
    if: github.event_name != 'push'
    needs: checksums
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        target: [api, cli]
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-linux-*
          path: wheelhouse
          merge-multiple: true
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          image: tonistiigi/binfmt:qemu-v10.2.3-68@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0
          platforms: arm64
          cache-image: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: image=moby/buildkit:v0.33.1@sha256:cec9f139f45e93c5c69c60f8b07cfad9f43f4ef6b6a6cd917527fea5ff2e3dea
          cache-binary: false
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          build-contexts: wheels=wheelhouse
          pull: true
          no-cache: true
          push: false
