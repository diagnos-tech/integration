# 🇺🇸 Static checks: lockfile, lint (Python, Rust, bilingual docstrings, docs
#    pairs and links), `mypy --strict`, and the published docs against the code
#    (`make docs-check`: fresh reference JSON, the site manifest, anchors,
#    every runnable example, `diagnos --help` against `cli.json`). Tests live in
#    their own workflows so each README badge answers exactly one question.
# 🇧🇷 Checagens estáticas: lockfile, lint (Python, Rust, docstrings bilíngues,
#    pares e links da documentação), `mypy --strict`, e a doc publicada contra o
#    código (`make docs-check`: JSON de referência em dia, o manifesto do site,
#    âncoras, todo exemplo executável, `diagnos --help` contra o `cli.json`). Os
#    testes têm workflows próprios para cada badge do README responder
#    exatamente uma pergunta.
name: CI

on:
  push:
    branches: [develop]
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint · types
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: uv lock --check
        run: uv lock --check
      - name: make lint
        run: make lint
      - name: make types
        run: make types
      - name: make docs-check
        run: make docs-check
