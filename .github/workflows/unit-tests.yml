# 🇺🇸 Unit tests of the three Python packages on every supported CPython, plus
#    the Rust enclave's own tests. Every leg enforces the coverage floor
#    (`fail_under` in `pyproject.toml`); on `develop`, the 3.12 leg also
#    publishes the coverage badge to the `badges` branch.
# 🇧🇷 Testes unitários dos três pacotes Python em todo CPython suportado, mais
#    os testes do próprio enclave Rust. Toda perna exige o piso de cobertura
#    (`fail_under` no `pyproject.toml`); na `develop`, a perna 3.12 também
#    publica o badge de cobertura na branch `badges`.
name: Unit tests

on:
  push:
    branches: [develop]
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          python-version: ${{ matrix.python }}
      - name: make cov
        run: make cov
      - name: Coverage summary
        if: always()
        env:
          PYTHON_VERSION: ${{ matrix.python }}
        run: |
          {
            echo "### Coverage · Cobertura — Python $PYTHON_VERSION"
            uv run coverage report --format=markdown
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload coverage report
        if: always() && matrix.python == '3.12'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: |
            htmlcov/
            coverage.xml
            coverage.json

  rust:
    name: Rust enclave
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: make test-rust
        run: make test-rust

  badge:
    name: Publish coverage badge
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    needs: [python, rust]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # 🇺🇸 push to the `badges` branch · 🇧🇷 push na branch `badges`
    concurrency:
      group: badges
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      # 🇺🇸 The one job that keeps the credential: `publish-badge.sh` pushes to the `badges` branch with it.
      #    It runs only on `develop`, after the tests, and executes nothing but this repository's own script.
      # 🇧🇷 O único job que mantém a credencial: o `publish-badge.sh` faz push na branch `badges` com ela.
      #    Roda só na `develop`, depois dos testes, e não executa nada além do script do próprio repositório.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true # zizmor: ignore[artipacked]
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage
      - name: Write badge JSON
        run: python3 scripts/badge.py coverage.json > "$RUNNER_TEMP/coverage.json"
      - name: Push to the badges branch
        run: scripts/publish-badge.sh "$RUNNER_TEMP/coverage.json" coverage.json
