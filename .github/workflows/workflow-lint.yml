# 🇺🇸 Workflow lint: are the workflows themselves safe and well formed?
#    zizmor audits them for the ways CI gets compromised — template injection, excessive permissions, unpinned
#    actions, persisted credentials, cache poisoning — and actionlint checks syntax, expressions and the shell
#    in every `run:`. Both are pinned; actionlint runs with no network at all.
# 🇧🇷 Lint de workflow: os próprios workflows são seguros e bem formados?
#    O zizmor os audita pelas formas como uma CI é comprometida — injeção de template, permissões excessivas,
#    actions sem fixar, credenciais persistidas, envenenamento de cache — e o actionlint confere sintaxe,
#    expressões e o shell de todo `run:`. Os dois são fixados; o actionlint roda sem rede nenhuma.
name: Workflow lint

on:
  push:
    branches: [develop]
  # 🇺🇸 Every pull request, not only those touching `.github/`: a required check must always report.
  # 🇧🇷 Todo pull request, não só os que mexem em `.github/`: um check obrigatório sempre precisa reportar.
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: workflow-lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  zizmor:
    name: zizmor
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # 🇺🇸 Annotations and a failing job: a plain required check, no Advanced Security needed.
      # 🇧🇷 Anotações e um job que falha: um check obrigatório simples, sem precisar de Advanced Security.
      - uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          version: 1.30.1
          advanced-security: false
          annotations: true

  actionlint:
    name: actionlint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: actionlint
        run: >-
          docker run --rm --network none -v "$PWD:/repo:ro" -w /repo
          rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 -color
