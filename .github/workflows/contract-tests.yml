# 🇺🇸 Consumer-driven contract tests (Pact, Rust `pact_ffi` engine): the real
#    SDK against the Pact mock server. Fails when the SDK's HTTP behaviour
#    changed without the committed contract changing with it. The vault
#    verifies the same file on its side before it deploys (see
#    `contracts/README.md`).
# 🇧🇷 Testes de contrato guiados pelo consumidor (Pact, motor Rust `pact_ffi`):
#    o SDK de verdade contra o mock server do Pact. Falha quando o
#    comportamento HTTP do SDK mudou sem o contrato commitado mudar junto. O
#    cofre verifica o mesmo arquivo do lado dele antes de implantar (ver
#    `contracts/README.pt-BR.md`).
name: Contract tests

on:
  push:
    branches: [develop]
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  consumer:
    name: SDK → vault (Pact consumer)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: make contract-check
        run: make contract-check
      - name: Contract summary
        if: always()
        run: python3 scripts/contract_summary.py contracts/diagnos-sdk-diagnos-vault.json >> "$GITHUB_STEP_SUMMARY"
      - name: Upload contract
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pact
          path: contracts/diagnos-sdk-diagnos-vault.json
