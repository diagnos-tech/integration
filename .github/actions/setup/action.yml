# The setup every CI job shares: the pinned Rust (for the enclave), uv, Python, and a locked `uv sync` that
# installs every extra and builds `diagnos._secure`, exactly as `make sync` does locally. Caches are restored
# everywhere but written only by runs on `develop`, so a pull request can never seed what a later run trusts.
name: Set up the project
description: Pinned Rust, uv, Python and a locked `uv sync`.
inputs:
  python-version:
    description: CPython version to test against.
    default: "3.13"
runs:
  using: composite
  steps:
    # The runner's rustup installs exactly what rust-toolchain.toml names, clippy and rustfmt included.
    - name: Rust from rust-toolchain.toml
      shell: bash
      run: rustup toolchain install
    - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      with:
        workspaces: apps/sdk/native
        save-if: ${{ github.ref == 'refs/heads/develop' }}
    - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      with:
        # Keep in sync with UV_VERSION in package.yml and the Dockerfile's `uv` stage.
        version: "0.13.0"
        python-version: ${{ inputs.python-version }}
        enable-cache: true
        save-cache: ${{ github.ref == 'refs/heads/develop' }}
    - name: uv sync --locked
      shell: bash
      run: uv sync --locked
