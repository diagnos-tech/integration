# zizmor configuration, used by the `workflows` job in ci.yml. Every audit runs at every severity, except:
#
# self-repository: actionlint 1.7.12 does not understand GitHub's `uses: $/...` form yet, and actionlint is what
#   checks a reusable workflow's inputs and outputs against its callers. Our workflows only ever check out this
#   repository, before any local action runs, so the runtime-filesystem risk this rule guards against is absent.
#   TODO(gustavo): Switch to `$/...` and drop this exception once actionlint supports it.
rules:
  self-repository:
    disable: true
