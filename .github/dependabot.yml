# Dependabot: monthly version updates into `develop`, one pull request per ecosystem.
#
# Minor and patch updates are grouped and merge by themselves once CI passes (workflows/auto-merge.yml). Major
# updates are left out of the groups, so each one gets its own pull request and waits for a review. Security
# updates do not wait for this schedule: Dependabot opens them as soon as an advisory is published. The cooldown
# skips releases younger than seven days, which gives the community time to catch a compromised one first.
# Actions and images are pinned by digest; the `# vX.Y.Z` comment beside each pin lets Dependabot move both.
version: 2
updates:
  - package-ecosystem: uv
    directory: /
    target-branch: develop
    schedule: { interval: monthly }
    cooldown: { default-days: 7 }
    groups:
      python: { patterns: ["*"], update-types: [minor, patch] }
    commit-message: { prefix: "build(deps)" }

  - package-ecosystem: cargo
    directory: /apps/sdk/native
    target-branch: develop
    schedule: { interval: monthly }
    cooldown: { default-days: 7 }
    groups:
      rust: { patterns: ["*"], update-types: [minor, patch] }
    commit-message: { prefix: "build(deps)" }

  - package-ecosystem: github-actions
    directories: ["/", "/.github/actions/*"]
    target-branch: develop
    schedule: { interval: monthly }
    cooldown: { default-days: 7 }
    groups:
      actions: { patterns: ["*"], update-types: [minor, patch] }
    commit-message: { prefix: "ci(deps)" }

  - package-ecosystem: docker
    directory: /
    target-branch: develop
    schedule: { interval: monthly }
    cooldown: { default-days: 7 }
    groups:
      images: { patterns: ["*"], update-types: [minor, patch] }
    commit-message: { prefix: "build(deps)" }
