[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "diagnos-cli"
version = "0.1.0"
description = "🇺🇸 Command line for the diagnos vault, built on the diagnos SDK · 🇧🇷 Linha de comando do cofre diagnos, construída sobre o SDK"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11,<3.14"
authors = [{ name = "diagnos" }]
keywords = ["diagnos", "medical", "zero-knowledge", "e2ee", "dicom", "cli"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Healthcare Industry",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Environment :: Console",
  "Typing :: Typed",
]
dependencies = ["diagnos", "typer>=0.15", "rich>=13.9"]

[project.optional-dependencies]
openbao = ["diagnos[openbao]"]

[project.urls]
Homepage = "https://diagnos.health/dev"
Documentation = "https://github.com/diagnos-tech/integration/tree/develop/cli#readme"
Source = "https://github.com/diagnos-tech/integration/tree/develop/cli"
Issues = "https://github.com/diagnos-tech/integration/issues"
Changelog = "https://github.com/diagnos-tech/integration/blob/develop/CHANGELOG.md"

[project.scripts]
diagnos = "diagnos_cli.main:app"

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.7", "mypy>=1.13"]

[tool.hatch.build.targets.wheel]
packages = ["src/diagnos_cli"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
