# 🇺🇸 The consumer contract suite has its own pytest root (`contracts/`), apart
#    from each package's unit tests: `make contract` runs it, and a green run
#    rewrites `diagnos-sdk-diagnos-vault.json` (see `tests/conftest.py`).
# 🇧🇷 A suíte de contrato do consumidor tem a própria raiz do pytest
#    (`contracts/`), separada dos testes unitários de cada pacote: `make
#    contract` a roda, e uma rodada verde regrava `diagnos-sdk-diagnos-vault.json`
#    (ver `tests/conftest.py`).
[pytest]
testpaths = tests
addopts = -ra -q
