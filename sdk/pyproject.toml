# 🇺🇸 Built by maturin: the pure-Python package in `src/diagnos` plus the Rust
#    memory enclave in `native/` (`diagnos._secure`), shipped as one wheel per
#    platform (abi3, CPython ≥ 3.11) — the same layout polars uses.
# 🇧🇷 Construído pelo maturin: o pacote Python puro em `src/diagnos` mais o
#    enclave de memória em Rust em `native/` (`diagnos._secure`), embarcados
#    como um wheel por plataforma (abi3, CPython ≥ 3.11) — o mesmo layout que o
#    polars usa.
[build-system]
requires = ["maturin>=1.8,<2.0"]
build-backend = "maturin"

[project]
name = "diagnos"
version = "0.1.0"
description = "🇺🇸 Official zero-knowledge SDK for the diagnos vault · 🇧🇷 SDK oficial zero-knowledge do cofre diagnos"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11,<3.14"
authors = [{ name = "diagnos" }]
keywords = ["diagnos", "medical", "zero-knowledge", "e2ee", "dicom"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Healthcare Industry",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Rust",
  "Topic :: Security :: Cryptography",
  "Typing :: Typed",
]
# 🇺🇸 Every cryptographic primitive lives in the Rust enclave; the Python side
#    needs only an HTTP client and a validator.
# 🇧🇷 Toda primitiva criptográfica vive no enclave em Rust; o lado Python só
#    precisa de um client HTTP e de um validador.
dependencies = ["httpx>=0.28", "pydantic>=2.9"]

[project.optional-dependencies]
openbao = ["hvac>=2.3"]

[project.urls]
Homepage = "https://diagnos.health/dev"
Documentation = "https://github.com/diagnos-tech/integration/tree/develop/sdk#readme"
Source = "https://github.com/diagnos-tech/integration/tree/develop/sdk"
Issues = "https://github.com/diagnos-tech/integration/issues"
Changelog = "https://github.com/diagnos-tech/integration/blob/develop/CHANGELOG.md"

[dependency-groups]
# 🇺🇸 `pynacl`, `cryptography` and `kyber-py` are independent implementations
#    the tests use as oracles against the Rust enclave — never runtime deps.
# 🇧🇷 `pynacl`, `cryptography` e `kyber-py` são implementações independentes
#    que os testes usam como oráculos contra o enclave em Rust — nunca
#    dependências de runtime.
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "ruff>=0.7",
  "mypy>=1.13",
  "hvac>=2.3",
  "pynacl>=1.5",
  "cryptography>=43",
  "kyber-py>=1.0",
  "pact-python>=3.4,<4",
  "pytest-cov>=6.0",
]

[tool.maturin]
python-source = "src"
module-name = "diagnos._secure"
manifest-path = "native/Cargo.toml"
features = ["pyo3/extension-module"]
strip = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
