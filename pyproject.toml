# 🇺🇸 uv workspace for the three public Python packages. `sdk` is the base;
#    `cli` and `api` are thin shells over it and never talk HTTP themselves.
# 🇧🇷 Workspace uv dos três pacotes Python públicos. `sdk` é a base; `cli` e
#    `api` são cascas finas sobre ele e nunca falam HTTP por conta própria.
[tool.uv.workspace]
members = ["sdk", "cli", "api"]

[tool.uv.sources]
diagnos = { workspace = true }

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "S", "ANN", "D"]
ignore = ["D203", "D213", "ANN401", "S101"]

[tool.ruff.lint.per-file-ignores]
# 🇺🇸 B008 (function call in a default) is the documented `typer` pattern for
# every option/argument in `cli/src/diagnos_cli/commands/`; there is no
# alternative spelling. Tests get a docstring pass on trivial one-line fake
# methods (`cli/tests/conftest.py`'s stand-ins) — the "why" they exist is on
# the class, not worth repeating per accessor.
# 🇧🇷 B008 (chamada de função num default) é o padrão documentado do `typer`
# para toda option/argument em `cli/src/diagnos_cli/commands/`; não há outra
# forma de escrever isso. Testes ganham dispensa de docstring em métodos
# falsos triviais de uma linha (os substitutos de `cli/tests/conftest.py`) —
# o "porquê" deles está na classe, não vale repetir por acessor.
"cli/src/diagnos_cli/commands/*.py" = ["B008"]
"cli/tests/*.py" = ["D102", "D103", "D107"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
# 🇺🇸 Test helpers imported by bare name (pytest puts each test folder on
#    `sys.path`) sort as local code, after `diagnos` and third-party imports.
# 🇧🇷 Helpers de teste importados pelo nome (o pytest põe cada pasta de teste
#    no `sys.path`) ordenam como código local, depois de `diagnos` e terceiros.
known-local-folder = ["_crypto", "_wire", "conftest", "vault_double"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
# 🇺🇸 The contract suite imports its helpers by bare name, as pytest runs it.
# 🇧🇷 A suíte de contrato importa os helpers pelo nome, como o pytest a roda.
mypy_path = "contracts/tests"

[[tool.mypy.overrides]]
# 🇺🇸 Test-only crypto oracles that ship no type information.
# 🇧🇷 Oráculos de cripto só de teste que não trazem informação de tipo.
module = ["kyber_py.*"]
ignore_missing_imports = true

# 🇺🇸 One combined coverage number for the three packages (`make cov`), with
#    branch coverage. `fail_under` is a ratchet: raise it when coverage goes
#    up, never lower it to make a pull request pass.
# 🇧🇷 Um número de cobertura combinado dos três pacotes (`make cov`), com
#    cobertura de ramos. `fail_under` é uma catraca: suba quando a cobertura
#    subir, nunca baixe para um pull request passar.
[tool.coverage.run]
branch = true
source_pkgs = ["diagnos", "diagnos_cli", "diagnos_api"]
relative_files = true

[tool.coverage.report]
fail_under = 92
show_missing = true
skip_covered = true
precision = 1
exclude_also = [
  "if TYPE_CHECKING:",
  "@overload",
  "raise NotImplementedError",
  "^\\s*\\.\\.\\.$",
]

[tool.coverage.html]
directory = "htmlcov"
