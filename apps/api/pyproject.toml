[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "diagnos-api"
version = "0.1.0"
description = "🇺🇸 REST facade (FastAPI, mandatory mTLS) over the diagnos SDK · 🇧🇷 Fachada REST (FastAPI, mTLS obrigatório) sobre o SDK diagnos"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11,<3.14"
authors = [{ name = "diagnos" }]
keywords = ["diagnos", "medical", "zero-knowledge", "e2ee", "dicom", "fastapi", "mtls"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Healthcare Industry",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Framework :: FastAPI",
  "Typing :: Typed",
]
dependencies = ["diagnos[openbao]", "fastapi>=0.115", "uvicorn[standard]>=0.32", "python-multipart>=0.0.12"]

[project.optional-dependencies]
# 🇺🇸 Only `diagnos-api dev-certs` needs it; a production image never generates certificates.
# 🇧🇷 Só o `diagnos-api dev-certs` precisa; uma imagem de produção nunca gera certificados.
dev = ["cryptography>=43"]

[project.urls]
Homepage = "https://diagnos.health/dev"
Documentation = "https://github.com/diagnos-tech/integration/tree/develop/apps/api#readme"
Source = "https://github.com/diagnos-tech/integration/tree/develop/apps/api"
Issues = "https://github.com/diagnos-tech/integration/issues"
Changelog = "https://github.com/diagnos-tech/integration/blob/develop/CHANGELOG.md"

[project.scripts]
diagnos-api = "diagnos_api.main:run"

[dependency-groups]
dev = ["pytest>=8.3", "httpx>=0.28", "ruff>=0.7", "mypy>=1.13", "cryptography>=43"]

[tool.hatch.build.targets.wheel]
packages = ["src/diagnos_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"

[tool.ruff]
# 🇺🇸 Inherits line-length/target-version/select/ignore from the workspace
# root (`../../pyproject.toml`) — this section only adds an api-specific
# extension, never a narrower rule set.
# 🇧🇷 Herda line-length/target-version/select/ignore da raiz do workspace
# (`../../pyproject.toml`) — esta seção só soma uma extensão específica da api,
# nunca um conjunto de regras mais estreito.
extend = "../../pyproject.toml"

[tool.ruff.lint.flake8-bugbear]
# 🇺🇸 FastAPI's `Depends(...)`/`File(...)`/`Form(...)` as a parameter default
# is the framework's own documented pattern, not the mutable-default footgun
# B008 exists to catch — FastAPI calls each one once per request, from the
# signature, by design.
# 🇧🇷 `Depends(...)`/`File(...)`/`Form(...)` como valor padrão de parâmetro é
# o próprio padrão documentado do FastAPI, não a armadilha de valor padrão
# mutável que o B008 existe para pegar — o FastAPI chama cada um uma vez por
# requisição, a partir da assinatura, de propósito.
extend-immutable-calls = ["fastapi.Depends", "fastapi.File", "fastapi.Form", "fastapi.Query", "fastapi.Path", "fastapi.Body"]
