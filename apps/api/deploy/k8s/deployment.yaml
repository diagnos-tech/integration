apiVersion: apps/v1
kind: Deployment
metadata:
  name: diagnos-api
  labels: { app.kubernetes.io/name: diagnos-api }
spec:
  # 🇺🇸 One replica per service account: a session belongs to one process.
  # 🇧🇷 Uma réplica por service account: uma sessão pertence a um processo.
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app.kubernetes.io/name: diagnos-api }
  template:
    metadata:
      labels: { app.kubernetes.io/name: diagnos-api }
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: api
          # 🇺🇸 The signed release image. Pin it by digest (`…diagnos-api@sha256:…`, printed by
          # `diagnos setup api` and in the GitHub release) after `cosign verify` — see `SECURITY.md`.
          # 🇧🇷 A imagem de release assinada. Fixe-a por digest (`…diagnos-api@sha256:…`, impresso pelo
          # `diagnos setup api` e no release do GitHub) depois do `cosign verify` — ver `SECURITY.pt-BR.md`.
          image: ghcr.io/diagnos-tech/diagnos-api:0.1.0
          ports: [{ name: https, containerPort: 8443 }]
          envFrom:
            - configMapRef: { name: diagnos-api }
          env:
            - name: DIAGNOS_CREDENTIAL
              valueFrom: { secretKeyRef: { name: diagnos-api, key: DIAGNOS_CREDENTIAL } }
            - name: OPENBAO_TOKEN
              valueFrom: { secretKeyRef: { name: diagnos-api, key: OPENBAO_TOKEN } }
            - { name: DIAGNOS_API_TLS_CERT_FILE, value: /certs/tls.crt }
            - { name: DIAGNOS_API_TLS_KEY_FILE, value: /certs/tls.key }
            - { name: DIAGNOS_API_MTLS_CA_FILE, value: /certs/clients-ca.pem }
          volumeMounts:
            - { name: certs, mountPath: /certs, readOnly: true }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            # 🇺🇸 The SDK locks its key material in RAM (`mlock`; `docs/PROTOCOL.md`'s
            # "never sends a key to the vault" guarantee is only as good as that key never
            # reaching swap). Everything is dropped and only `IPC_LOCK` is added back, but
            # note what that buys a non-root process here: `allowPrivilegeEscalation: false`
            # sets `no_new_privs`, under which the kernel ignores the image's `cap_ipc_lock`
            # file capability. Locking past 64 KiB then depends on the node's
            # `RLIMIT_MEMLOCK` for containers; without it the SDK runs in its best-effort mode
            # and says so (`MemoryLockWarning`, `diagnos status`). Check it once per cluster.
            # 🇧🇷 O SDK trava seu material de chave na RAM (`mlock`; a garantia "nunca envia
            # uma chave ao cofre" de `docs/PROTOCOL.md` só vale o que essa chave nunca
            # alcançar o swap). Tudo é derrubado e só `IPC_LOCK` volta, mas veja o que isso
            # garante a um processo não-root aqui: `allowPrivilegeEscalation: false` liga o
            # `no_new_privs`, sob o qual o kernel ignora a file capability `cap_ipc_lock` da
            # imagem. Travar além de 64 KiB passa a depender do `RLIMIT_MEMLOCK` do nó para
            # containers; sem ele o SDK roda no modo best-effort e avisa
            # (`MemoryLockWarning`, `diagnos status`). Confira uma vez por cluster.
            capabilities: { drop: [ALL], add: [IPC_LOCK] }
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: "1", memory: 512Mi }
          readinessProbe:
            # 🇺🇸 TCP only: an HTTPS probe without a client certificate is rejected by design.
            # 🇧🇷 Só TCP: uma sonda HTTPS sem certificado de cliente é recusada por desenho.
            tcpSocket: { port: https }
            periodSeconds: 10
      volumes:
        - name: certs
          secret:
            secretName: diagnos-api
            items:
              - { key: tls.crt, path: tls.crt }
              - { key: tls.key, path: tls.key }
              - { key: clients-ca.pem, path: clients-ca.pem }
