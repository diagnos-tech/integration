# One Rust for every build of the enclave (`make sync`, CI, the release wheels and the images), so a release is never
# compiled by whatever happened to be "stable" that day. Bump it on purpose, together with the Rust base image of the
# Dockerfile (`FROM rust:...`) in the same commit.
[toolchain]
channel = "1.99.0"
components = ["clippy", "rustfmt"]
profile = "minimal"
